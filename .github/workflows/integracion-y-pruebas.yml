name: Integración y pruebas

on:
  push:
    branches: [main, semana16-integracion]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.x

jobs:
  analisis-y-pruebas:
    name: flutter analyze y flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Versión de Flutter
        run: flutter --version | tee flutter-version.txt

      - name: Dependencias
        run: flutter pub get

      - name: flutter analyze
        run: |
          flutter analyze 2>&1 | tee flutter-analyze.txt
          exit "${PIPESTATUS[0]}"

      - name: flutter test (unitarias y de widget)
        run: |
          flutter test --reporter expanded 2>&1 | tee flutter-test.txt
          exit "${PIPESTATUS[0]}"

      - name: Formato del código (informativo)
        if: always()
        run: |
          dart format lib test
          git diff > dart-format.patch
          git diff --stat

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analisis-y-pruebas
          path: |
            flutter-version.txt
            flutter-analyze.txt
            flutter-test.txt
            dart-format.patch

  pruebas-funcionales:
    name: Pruebas funcionales en Flutter Web con emuladores de Firebase
    needs: analisis-y-pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Firebase CLI y Playwright
        run: |
          npm install -g firebase-tools@15.36.0
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Compilar la app web
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn \
            --dart-define=ENABLE_TEST_SEMANTICS=true 2>&1 | tee flutter-build-web.txt
          exit "${PIPESTATUS[0]}"

      - name: Iniciar emuladores de Auth y Firestore y servir la app
        run: |
          nohup firebase emulators:start --project demo-practica-flutter \
            --only auth,firestore > emuladores.log 2>&1 &
          nohup python -m http.server 7357 --bind 127.0.0.1 \
            --directory build/web > servidor.log 2>&1 &
          for port in 9099 8080 4000 7357; do
            for _ in $(seq 1 90); do nc -z 127.0.0.1 "$port" && break; sleep 2; done
            nc -z 127.0.0.1 "$port" || { echo "Puerto $port sin respuesta"; cat emuladores.log; exit 1; }
          done

      - name: Dos rondas de casos con evidencias
        run: |
          python integration_test/validar_web.py --evidencias 2>&1 \
            | tee docs/evidencias/pruebas-y-analisis/07-pruebas-funcionales.txt
          exit "${PIPESTATUS[0]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-funcionales
          path: |
            docs/evidencias/capturas-aplicacion/
            docs/evidencias/firebase/
            docs/evidencias/pruebas-y-analisis/07-pruebas-funcionales.txt
            flutter-build-web.txt
            emuladores.log
